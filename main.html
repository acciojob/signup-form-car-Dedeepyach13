<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
<form method="post">
	<label for="name">Name</label>
	<input type="text" required name="name" id="name" placeholder="Name">
	<br><br>
	
	<label for="email">Email</label>
	<input type="email" required name="email" id="email" placeholder="Email">
	<br><br>
	
	<label>Gender</label>
	<input type="radio" required name="gender" id="gender_m">
	<label for="gender_m">Male</label>
	
	<input type="radio" required name="gender" id="gender_f">
	<label for="gender_f">Female</label>
	<br><br>
	
	<label for="car">Car Brands</label>
	<select id="cars" name="cars" required>
		<option value="">--Please choose an option--</option>
            <option value="BMW">BMW</option>
            <option value="Audi">Audi</option>
            <option value="Mercedes">Mercedes</option>
            <option value="Toyota">Toyota</option>	
	</select>
	<br><br>
	
	<label for="age">Age</label>
	<input type="number" required name="age" id="age">
	<br><br>
	
	<label for="dob">DOB</label>
	<input type="date" required name="dob" id="dob">
	<br><br>
	
	<label for="tel">Phone Number</label>
	<input type="tel" name="tel" id="tel" placeholder="xxx-xxx-xxxx">
	<br><br>
	
	<label for="password">Password</label>
	<input type="password" required name="password" id="password" placeholder="Password">
	<br><br>
	
	<label for="tos">I agree to the TOS</label>
	<input type="checkbox" required name="tos" id="tos">
	<br><br>

	<button type="submit">Submit</button>
</form>


	
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
